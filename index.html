<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cultura Fusca</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #0e1117; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
    #game-container { width: 100%; max-width: 520px; background: #161b22; border-radius: 12px; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
    
    /* Header & Logo */
    .game-header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; }
    .game-logo { height: 55px; width: 55px; border-radius: 50%; object-fit: cover; border: 2px solid #58a6ff; box-shadow: 0 0 10px rgba(88, 166, 255, 0.4); }
    h1 { color: #f1c40f; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    
    /* Pre-game garage */
    .garage-panel { background: #21262d; border-radius: 8px; padding: 12px; margin-bottom: 10px; text-align: left; border: 1px solid #30363d; }
    .garage-title { font-size: 14px; font-weight: bold; color: #58a6ff; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .garage-options { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .color-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; transition: transform 0.1s; }
    .color-btn:hover { transform: scale(1.15); }
    .num-input { width: 60px; padding: 4px 8px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 4px; font-weight: bold; text-align: center; }
    .btn-reset-save { background: #da3633; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }

    /* Canvas Area */
    #canvas-container { position: relative; width: 100%; aspect-ratio: 1; background: #2d8a4e; border-radius: 10px; overflow: hidden; border: 2px solid #30363d; }
    canvas { width: 100%; height: 100%; display: block; }
    
    /* Overlay HUD */
    .hud-badge { position: absolute; background: rgba(0,0,0,0.75); color: #fff; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 13px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px); }
    #hud-pos { top: 10px; left: 10px; }
    #hud-lap { top: 10px; right: 10px; }
    
    /* Nitro HUD */
    #hud-nitro-box { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 8px; border-radius: 8px; border: 1px solid #444; width: 120px; text-align: center; }
    .nitro-title { font-size: 11px; font-weight: bold; color: #ff9f43; margin-bottom: 4px; }
    .nitro-bar-bg { width: 100%; height: 10px; background: #222; border-radius: 5px; overflow: hidden; margin-bottom: 6px; border: 1px solid #555; }
    .nitro-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff9f43, #ee5253); transition: width 0.1s; }
    .btn-nitro { width: 100%; padding: 6px; background: #ee5253; color: #fff; border: none; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; text-transform: uppercase; }
    .btn-nitro:disabled { background: #555; opacity: 0.6; cursor: not-allowed; }

    /* Race Controls */
    .btn-start { width: 100%; padding: 12px; background: #238636; color: #fff; border: none; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; }
    .btn-start:hover { background: #2ea043; }

    /* Dashboard & Shop */
    .dashboard { display: flex; justify-content: space-around; background: #21262d; padding: 8px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #30363d; }
    .stat-item { font-size: 12px; color: #8b949e; }
    .stat-item span { display: block; font-size: 15px; font-weight: bold; color: #2ea043; }

    .upgrades-container { max-height: 220px; overflow-y: auto; text-align: left; padding-right: 4px; }
    .upgrades-container::-webkit-scrollbar { width: 6px; }
    .upgrades-container::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    .upgrade-card { background: #21262d; padding: 10px; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #30363d; }
    .upgrade-info h5 { font-size: 13px; color: #e6edf3; }
    .upgrade-info p { font-size: 11px; color: #8b949e; }
    .btn-buy { background: #1f6beb; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; }
    .btn-buy:disabled { background: #30363d; color: #6e7681; cursor: not-allowed; }
  </style>
</head>
<body>

<div id="game-container">
  <!-- Topo com Logo e Nome -->
  <div class="game-header">
    <img id="cultura-logo" class="game-logo" src="Cultura fusca.jpg" alt="Cultura Fusca">
    <h1>Cultura Fusca</h1>
  </div>

  <!-- Garagem de Customização -->
  <div class="garage-panel" id="garage-panel">
    <div class="garage-title">
      <span>🎨 Garagem & Customização (Fusca #<span id="txt-num-display">86</span>)</span>
      <button class="btn-reset-save" onclick="resetSave()">Resetar Jogo</button>
    </div>
    <div class="garage-options">
      <span style="font-size:12px; color:#8b949e">Cor:</span>
      <div class="color-btn" style="background:#8e8e8e" onclick="setCarColor('#8e8e8e')"></div>
      <div class="color-btn" style="background:#e74c3c" onclick="setCarColor('#e74c3c')"></div>
      <div class="color-btn" style="background:#3498db" onclick="setCarColor('#3498db')"></div>
      <div class="color-btn" style="background:#f1c40f" onclick="setCarColor('#f1c40f')"></div>
      <div class="color-btn" style="background:#2ecc71" onclick="setCarColor('#2ecc71')"></div>
      <div class="color-btn" style="background:#9b59b6" onclick="setCarColor('#9b59b6')"></div>
      
      <span style="font-size:12px; color:#8b949e; margin-left:10px">Nº:</span>
      <input type="number" id="inputNum" class="num-input" value="86" min="1" max="999" onchange="setCarNumber(this.value)">
    </div>
  </div>

  <div class="dashboard">
    <div class="stat-item">Dinheiro<span id="txt-money">R$ 150</span></div>
    <div class="stat-item">Torcida<span id="txt-fans">0 Fãs</span></div>
    <div class="stat-item">Circuito<span id="txt-track">Pista 1</span></div>
  </div>

  <!-- Pista de Corrida -->
  <div id="canvas-container">
    <canvas id="raceCanvas" width="500" height="500"></canvas>
    <div class="hud-badge" id="hud-pos">Pos: 16/16</div>
    <div class="hud-badge" id="hud-lap">Lap: 0/5</div>
    
    <div id="hud-nitro-box">
      <div class="nitro-title">NITRO</div>
      <div class="nitro-bar-bg"><div class="nitro-bar-fill" id="nitro-fill"></div></div>
      <button class="btn-nitro" id="btn-nitro" onclick="useNitro()">Ativar Nitro</button>
    </div>
  </div>

  <button class="btn-start" id="btnStart" onclick="toggleRace()" style="margin-top:10px">Iniciar Grande Prêmio (5 Voltas)</button>

  <div style="text-align:left; font-size:14px; font-weight:bold; color:#f1c40f; margin:10px 0 6px;">🔧 Oficina Cultura Fusca (Nível Máx. 200)</div>
  <div class="upgrades-container" id="upgrades-list"></div>
</div>

<script>
  // Carrega Imagem do Logo para o Canvas
  const logoImage = new Image();
  logoImage.src = 'Cultura fusca.jpg';
  logoImage.onload = () => { drawScene(); };

  // Configuração Padrão do Estado
  const defaultState = {
    money: 150,
    fans: 0,
    track: 1,
    racing: false,
    playerColor: '#8e8e8e',
    playerNum: '86',
    lap: 0,
    totalLaps: 5,
    pos: 16,
    nitro: 100,
    nitroActive: false,
    upgrades: {
      engine: { name: "Motor Boxer VW", lvl: 1, maxLvl: 200, baseCost: 150, mult: 1.18 },
      tires: { name: "Pneus Radiais Racing", lvl: 1, maxLvl: 200, baseCost: 180, mult: 1.18 },
      aero: { name: "Aerodinâmica e Peso", lvl: 1, maxLvl: 200, baseCost: 220, mult: 1.20 },
      sponsors: { name: "Patrocínio e Torcida", lvl: 1, maxLvl: 200, baseCost: 300, mult: 1.22 }
    }
  };

  let state = JSON.parse(JSON.stringify(defaultState));

  // Função para Guardar o Progresso
  function saveProgress() {
    const dataToSave = {
      money: state.money,
      fans: state.fans,
      track: state.track,
      playerColor: state.playerColor,
      playerNum: state.playerNum,
      upgrades: state.upgrades
    };
    localStorage.setItem('cultura_fusca_save', JSON.stringify(dataToSave));
  }

  // Função para Carregar o Progresso
  function loadProgress() {
    const saved = localStorage.getItem('cultura_fusca_save');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        state.money = parsed.money ?? state.money;
        state.fans = parsed.fans ?? state.fans;
        state.track = parsed.track ?? state.track;
        state.playerColor = parsed.playerColor ?? state.playerColor;
        state.playerNum = parsed.playerNum ?? state.playerNum;

        if (parsed.upgrades) {
          for (let key in parsed.upgrades) {
            if (state.upgrades[key]) {
              state.upgrades[key].lvl = parsed.upgrades[key].lvl;
            }
          }
        }
        document.getElementById('inputNum').value = state.playerNum;
        document.getElementById('txt-num-display').innerText = state.playerNum;
      } catch (e) {
        console.error("Erro ao carregar dados salvos:", e);
      }
    }
  }

  function resetSave() {
    if (confirm("Tem certeza que deseja apagar todo o seu progresso?")) {
      localStorage.removeItem('cultura_fusca_save');
      location.reload();
    }
  }

  const canvas = document.getElementById('raceCanvas');
  const ctx = canvas.getContext('2d');

  const trackPoints = [
    {x: 100, y: 400}, {x: 250, y: 400}, {x: 400, y: 400},
    {x: 430, y: 350}, {x: 430, y: 250}, {x: 380, y: 200},
    {x: 280, y: 200}, {x: 230, y: 150}, {x: 280, y: 100},
    {x: 400, y: 100}, {x: 440, y: 70},  {x: 250, y: 60},
    {x: 80,  y: 60},  {x: 60,  y: 200}, {x: 60,  y: 350}
  ];

  function getSplinePoint(t) {
    const p = trackPoints;
    const n = p.length;
    let i = Math.floor(t * n);
    let localT = (t * n) - i;
    
    let p0 = p[(i - 1 + n) % n];
    let p1 = p[i % n];
    let p2 = p[(i + 1) % n];
    let p3 = p[(i + 2) % n];

    let t2 = localT * localT;
    let t3 = t2 * localT;

    let x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * localT + (2*p0.x - 5*p1.x + 4*p2.x - p3.x) * t2 + (-p0.x + 3*p1.x - 3*p2.x + p3.x) * t3);
    let y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * localT + (2*p0.y - 5*p1.y + 4*p2.y - p3.y) * t2 + (-p0.y + 3*p1.y - 3*p2.y + p3.y) * t3);

    return {x, y};
  }

  let cars = [];
  const totalCars = 16;
  const aiColors = ['#e74c3c','#3498db','#f1c40f','#2ecc71','#9b59b6','#e67e22','#1abc9c','#e84393','#00cec9','#6c5ce7','#fdcb6e','#e17055','#d63031','#022c22','#b2bec3'];

  function initCars() {
    cars = [];
    cars.push({
      isPlayer: true,
      color: state.playerColor,
      num: state.playerNum,
      progress: 0,
      lap: 0,
      laneOffset: 0,
      speed: 0
    });

    let basePlayerSpeed = (0.00035 + (state.upgrades.engine.lvl * 0.000008) + (state.upgrades.aero.lvl * 0.000004)) * 1.25;

    for(let i=1; i<totalCars; i++) {
      let variation = (Math.random() * 0.09) - 0.04; 
      let aiBaseSpeed = basePlayerSpeed * (0.97 + variation);

      cars.push({
        isPlayer: false,
        color: aiColors[i % aiColors.length],
        num: Math.floor(Math.random()*89 + 10).toString(),
        progress: (i * 0.015),
        lap: 0,
        laneOffset: (Math.random() - 0.5) * 14,
        baseSpeed: aiBaseSpeed
      });
    }
  }

  function setCarColor(c) {
    state.playerColor = c;
    if(cars[0]) cars[0].color = c;
    saveProgress();
    drawScene();
  }

  function setCarNumber(n) {
    state.playerNum = n || '86';
    document.getElementById('txt-num-display').innerText = state.playerNum;
    if(cars[0]) cars[0].num = state.playerNum;
    saveProgress();
    drawScene();
  }

  function updateUI() {
    document.getElementById('txt-money').innerText = `R$ ${Math.floor(state.money)}`;
    document.getElementById('txt-fans').innerText = `${state.fans} Fãs`;
    document.getElementById('txt-track').innerText = `Circuito ${state.track}`;
    document.getElementById('hud-lap').innerText = `Lap: ${state.lap}/${state.totalLaps}`;
    document.getElementById('hud-pos').innerText = `Pos: ${state.pos}/${totalCars}`;
    document.getElementById('nitro-fill').style.width = `${state.nitro}%`;
    document.getElementById('btn-nitro').disabled = state.nitro < 20 || state.nitroActive;
    renderUpgrades();
  }

  function renderUpgrades() {
    const container = document.getElementById('upgrades-list');
    container.innerHTML = '';

    for (let key in state.upgrades) {
      const up = state.upgrades[key];
      const cost = Math.floor(up.baseCost * Math.pow(up.mult, up.lvl - 1));
      const isMax = up.lvl >= up.maxLvl;

      const card = document.createElement('div');
      card.className = 'upgrade-card';
      card.innerHTML = `
        <div class="upgrade-info">
          <h5>${up.name}</h5>
          <p>Nível: ${up.lvl} / ${up.maxLvl}</p>
        </div>
        <button class="btn-buy" onclick="buyUpgrade('${key}')" ${(state.money < cost || isMax) ? 'disabled' : ''}>
          ${isMax ? 'MAX' : `R$ ${cost}`}
        </button>
      `;
      container.appendChild(card);
    }
  }

  function buyUpgrade(key) {
    const up = state.upgrades[key];
    const cost = Math.floor(up.baseCost * Math.pow(up.mult, up.lvl - 1));
    if (state.money >= cost && up.lvl < up.maxLvl) {
      state.money -= cost;
      up.lvl++;
      saveProgress();
      updateUI();
    }
  }

  function useNitro() {
    if(state.nitro >= 20 && !state.nitroActive) {
      state.nitroActive = true;
      state.nitro -= 30;
      setTimeout(() => { state.nitroActive = false; }, 2500);
    }
  }

  function toggleRace() {
    if(!state.racing) {
      state.racing = true;
      state.lap = 0;
      initCars();
      document.getElementById('btnStart').innerText = "Corrida em Andamento...";
      document.getElementById('btnStart').disabled = true;
      requestAnimationFrame(gameLoop);
    }
  }

  function gameLoop() {
    if(!state.racing) return;

    let basePlayerSpeed = (0.00035 + (state.upgrades.engine.lvl * 0.000008) + (state.upgrades.aero.lvl * 0.000004)) * 1.25;
    let tireBonus = 1 + (state.upgrades.tires.lvl * 0.002);
    basePlayerSpeed *= tireBonus;

    if(state.nitroActive) basePlayerSpeed *= 1.6;
    cars[0].speed = basePlayerSpeed;

    cars.forEach(car => {
      let spd = car.isPlayer ? car.speed : car.baseSpeed;
      car.progress += spd;
      
      if(car.progress >= 1) {
        car.progress -= 1;
        car.lap++;
        if(car.isPlayer) {
          state.lap++;
          
          const sponsorBonus = 1 + (state.upgrades.sponsors.lvl * 0.03);
          const lapReward = Math.floor(25 * sponsorBonus);
          state.money += lapReward;
          state.fans += Math.floor(3 * sponsorBonus);
          
          if(state.nitro < 100) state.nitro = Math.min(100, state.nitro + 20);

          saveProgress();

          if(state.lap >= state.totalLaps) {
            finishRace();
            return;
          }
        }
      }
    });

    cars.sort((a, b) => (b.lap + b.progress) - (a.lap + a.progress));
    state.pos = cars.findIndex(c => c.isPlayer) + 1;

    updateUI();
    drawScene();

    if(state.racing) {
      requestAnimationFrame(gameLoop);
    }
  }

  function finishRace() {
    state.racing = false;
    document.getElementById('btnStart').innerText = "Iniciar Nova Corrida (5 Voltas)";
    document.getElementById('btnStart').disabled = false;

    const prizeByPosition = [300, 200, 150, 100, 80, 60, 50, 40, 30, 25, 20, 15, 10, 5, 2, 0];
    const sponsorBonus = 1 + (state.upgrades.sponsors.lvl * 0.03);
    const finalReward = Math.floor((prizeByPosition[state.pos - 1] || 0) * sponsorBonus);
    
    state.money += finalReward;
    saveProgress();
    updateUI();

    alert(`🏁 Fim de Prova!\n\nPosição Final: ${state.pos}º\nPrêmio da Posição: R$ ${finalReward}`);
  }

  function drawScene() {
    ctx.clearRect(0,0, canvas.width, canvas.height);

    ctx.fillStyle = "#2d8a4e";
    ctx.fillRect(0,0, canvas.width, canvas.height);

    // Desenha o Logo Cultura Fusca no Miolo da Pista
    if (logoImage.complete && logoImage.naturalWidth !== 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(250, 260, 60, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(logoImage, 190, 200, 120, 120);
      ctx.restore();
      
      ctx.beginPath();
      ctx.arc(250, 260, 60, 0, Math.PI * 2);
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();
    }

    drawGrandstand(150, 10, 160, 35, "#3498db");
    drawGrandstand(200, 455, 140, 35, "#e74c3c");
    drawTrees(30, 30);
    drawTrees(440, 420);

    ctx.beginPath();
    for(let t=0; t<=1; t+=0.005) {
      let pt = getSplinePoint(t);
      if(t===0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.closePath();
    ctx.lineWidth = 44;
    ctx.strokeStyle = "#ffffff";
    ctx.stroke();

    ctx.lineWidth = 42;
    ctx.strokeStyle = "#e74c3c";
    ctx.setLineDash([12, 12]);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.lineWidth = 34;
    ctx.strokeStyle = "#2c3e50";
    ctx.stroke();

    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.stroke();

    let startPt = getSplinePoint(0);
    ctx.save();
    ctx.translate(startPt.x, startPt.y);
    ctx.fillStyle = "#fff";
    ctx.fillRect(-2, -16, 4, 32);
    ctx.restore();

    cars.forEach(car => {
      let pt = getSplinePoint(car.progress);
      let nextPt = getSplinePoint((car.progress + 0.002) % 1);
      let angle = Math.atan2(nextPt.y - pt.y, nextPt.x - pt.x);

      let renderX = pt.x + Math.cos(angle + Math.PI/2) * car.laneOffset;
      let renderY = pt.y + Math.sin(angle + Math.PI/2) * car.laneOffset;

      drawFusca(renderX, renderY, angle, car.color, car.num, car.isPlayer);
    });
  }

  function drawFusca(x, y, angle, color, num, isPlayer) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle + Math.PI/2);

    if(isPlayer) {
      ctx.shadowColor = "#f1c40f";
      ctx.shadowBlur = 8;
    }

    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(-8, -12, 16, 26);

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(-9, -13, 18, 26, 6);
    ctx.fill();

    ctx.fillStyle = "#111";
    ctx.fillRect(-6, -5, 12, 5);
    ctx.fillRect(-6, 3, 12, 4);

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#000";
    ctx.font = "bold 6px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(num, 0, 0);

    ctx.restore();
  }

  function drawGrandstand(x, y, w, h, color) {
    ctx.fillStyle = "#bdc3c7";
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x+2, y+2, w-4, 8);
    ctx.fillRect(x+2, y+14, w-4, 8);
  }

  function drawTrees(x, y) {
    ctx.fillStyle = "#1e7138";
    ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+10, y+8, 10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x-8, y+6, 11, 0, Math.PI*2); ctx.fill();
  }

  // Inicialização com carregamento do Save
  loadProgress();
  initCars();
  updateUI();
  drawScene();
</script>

</body>
</html>
